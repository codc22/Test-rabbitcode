<div class="container">
  <h1>{{ title }}</h1>
  
  <div class="form-section">
    <h2>Login / Register</h2>
    
    <!-- ISSUE: No input validation attributes -->
    <input 
      type="text" 
      [(ngModel)]="username" 
      placeholder="Username"
      class="input-field"
    />
    
    <input 
      type="email" 
      [(ngModel)]="email" 
      placeholder="Email"
      class="input-field"
    />
    
    <input 
      type="password" 
      [(ngModel)]="password" 
      placeholder="Password"
      class="input-field"
    />
    
    <div class="button-group">
      <button (click)="login()">Login</button>
      <button (click)="register()">Register</button>
    </div>
  </div>
  
  <div class="users-section">
    <h2>Users</h2>
    <button (click)="loadUsers()">Refresh</button>
    
    <!-- ISSUE: Potential XSS - rendering user data without sanitization -->
    <div *ngFor="let user of users" class="user-card">
      <h3>{{ user.username }}</h3>
      <p>{{ user.email }}</p>
      <!-- ISSUE: Dangerous innerHTML usage without sanitization -->
      <div [innerHTML]="user.bio"></div>
      <button (click)="deleteUser(user.id)">Delete</button>
    </div>
  </div>
</div>
